name: Whispers V2 CI
on:
  push:
    branches: ["original", "phase-**", "all-phases-complete", "mentor-readiness-dashboard"]
  pull_request:
    branches: ["original", "main", "phase-**", "all-phases-complete"]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m compileall -q src/wow studio_v2.py notebooks/kaggle/batch_generate.py scripts/kaggle_job.py scripts/mentor_demo.py scripts/analyze_dataset.py scripts/train_emotion_classifier.py scripts/benchmark_cpu.py scripts/run_local_model_job.py scripts/prepare_listener_study.py scripts/analyze_listener_study.py run_studio.py
      - run: python -m pytest tests/phase_v2 -q
      - run: pip install -e ".[studio]"
      - run: python -m pytest tests/test_studio_smoke.py -q
      - run: python scripts/local_smoke.py
      - run: python scripts/mentor_demo.py --output .wow_workspace/ci_mentor_demo
      - run: python scripts/benchmark_cpu.py --output .wow_workspace/ci_mentor_demo/cpu_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: mentor-cpu-evidence
          path: |
            .wow_workspace/ci_mentor_demo/mentor_evidence.json
            .wow_workspace/ci_mentor_demo/cpu_benchmark.json
            .wow_workspace/ci_mentor_demo/artifacts/
          if-no-files-found: error
      - run: ruff check src/wow tests/phase_v2
