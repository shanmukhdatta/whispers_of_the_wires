name: Whispers V2 CI
on:
  push:
    branches: ["original", "phase-**"]
  pull_request:
    branches: ["original", "main", "phase-**"]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m compileall -q src/wow
      - run: python -m pytest tests/phase_v2 -q
      - run: ruff check src/wow tests/phase_v2
